{% extends "base.html" %}

{% block content %}
<div class="container">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/quil/quil.css') }}">
    <style>
        #quill-editor { height: 300px; }
    </style>

    <h2>{{ title }}</h2>


    <form method="post" id="incidentForm">
        <div class="container ">
            <div class="row">
                <div class="col">
                    <div class="mb-3">
                        <label for="status_incidente" class="form-label"><strong>Status</strong></label>        
                        <select class="form-select" name="status_incidente" aria-label="Default select example" >
                            <option selected>{{ incident.status_incident if incident else 'Selecione o Status' }}</option>
                            
                                {% for status in status_incident_list %}
                                    {% if edit_mode or status.id != 4 %}
                                        <option value="{{status.status}}">
                                        {{status.status}}
                                        </option>
                                    {% endif %}
                                {% endfor %}
                        </select>

                    </div>
                </div>

            </div>
            <div class="row">
                <div class="col">
                    <div class="mb-3">
                        <label for="start_data_hora" class="form-label">Data/Hora Registro</label>
                        <input type="datetime-local" class="form-control" 
                        name="start_data_hora" 
                        placeholder="Data/Hora Registro" 
                        value="{{ incident.start_date if incident else '' }}" required>
                    </div>
                </div>
                <div class="col">
                    <label for="incident_type" class="form-label">Tipo de Incidente</label>        
                    <select class="form-select" name="incident_type" aria-label="Default select example">
                        <option selected>{{ incident.incident_type if incident else 'Selecione o Tipo de Incidente' }}</option>
                        {% for tp_incidente in incidents_types %}
                        <option value="{{tp_incidente.tipo_incidente}}">
                        {{tp_incidente.tipo_incidente}}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="mb-3">
                        <label for="report_number" class="form-label">Num Relatorio</label>
                        <input type="text" class="form-control" name="report_number" placeholder="Número do Relatorio Semanal ou Técnico" value="{{ incident.report_number if incident else '' }}" required>
                    </div>

                </div>
                <div class="col">
                    <div class="mb-3">
                        <label for="ticket_number" class="form-label">Num Mensagem</label>
                        <input type="text" class="form-control" name="ticket_number" placeholder="Número da mensagem ou chamado" value="{{ incident.ticket_number if incident else '' }}"  >
                    </div>

                </div>

            </div>
        </div>
        <div class="container">
            <div class="row">
                <div class="col">
                    <label for="btl" class="form-label">Batalhão</label>        
                    <select class="form-select" name="btl" id="btl_select" aria-label="Default select example" >
                        <option selected>{{ incident.btl if incident else 'Selecione o Batalhão' }}</option>
                        
                        {% for unidade in unidades %}
                        <option value="{{unidade.btl}}"
                                data-cpa="{{unidade.cpa}}"
                        >
                        {{unidade.btl}}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col">
                    <div class="mb-3">
                        <label for="cpa" class="form-label">CPA</label>
                        <!-- Campo com preenchimento automatico -->
                        <input type="text" class="form-control" name="cpa" id="cpa_input" placeholder="CPA / Grande Comando" value="{{ incident.cpa if incident else '' }}" readonly required>
                    </div>
                </div>
                <div class="col">
                    <div class="mb-3">
                        <label for="cia" class="form-label">Cia</label>
                        <input type="text" class="form-control" name="cia" placeholder="Cia" value="{{ incident.cia if incident else '' }}" >
                    </div>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="row">
                <div class="col">
                    <h3>Descrição do Incidente</h3>
                    <div id="quill-editor"></div>
                    <input type="hidden" name="description" id="description_input">
                </div>
            </div>
        </div>
    

    <div class="container mt-2">
        {% if edit_mode %}
        <button type="submit" class="btn btn-primary mb-3"  id="btnSalvar" onclick="return confirm('Tem certeza de que deseja salvar as alterações?')">Salvar Alterações</button>
        {% else %}
        <button type="submit" class="btn btn-primary mb-3"  id="btnSalvar" >Registrar Incidente</button>
        {% endif %}
    </div>
        
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/quill/quil.js') }}"></script>
<script>
    var quill = new Quill('#quill-editor', {
        theme: 'snow',
        modules: {
            toolbar: [
                [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
                ['bold', 'italic', 'underline', 'strike'],
                [{ 'color': [] }, { 'background': [] }],
                [{ 'script': 'sub'}, { 'script': 'super' }],
                ['blockquote', 'code-block'],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                [{ 'indent': '-1'}, { 'indent': '+1' }],
                [{ 'direction': 'rtl' }],
                [{ 'size': ['small', false, 'large', 'huge'] }],
                [{ 'font': [] }],
                [{ 'align': [] }],
                ['link', 'image', 'video'],
                ['clean']
            ]
        }
    });

    // Carrega conteúdo inicial se estiver em modo de edição
    {% if incident and incident.description %}
        quill.clipboard.dangerouslyPasteHTML(0, `{{ incident.description|safe }}`);
    {% endif %}

    // Image upload handler
    quill.getModule('toolbar').addHandler('image', function() {
        var input = document.createElement('input');
        input.setAttribute('type', 'file');
        input.setAttribute('accept', 'image/*');
        input.click();
        input.onchange = function() {
            var file = input.files[0];
            var formData = new FormData();
            formData.append('upload', file);
            
            fetch("{{ url_for('incidente.upload_image') }}", {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(result => {
                if (result.url) {
                    var range = quill.getSelection();
                    quill.insertEmbed(range.index, 'image', result.url);
                    quill.setSelection(range.index + 1);
                }
            })
            .catch(error => console.error('Error:', error));
        };
    });

    // Handler para colagem de imagens (Ctrl+V)
    quill.root.addEventListener('paste', function(e) {
        var clipboardData = e.clipboardData || window.clipboardData;
        if (!clipboardData || !clipboardData.items) return;

        var hasImage = false;
        for (var i = 0; i < clipboardData.items.length; i++) {
            if (clipboardData.items[i].type.indexOf('image') !== -1) {
                hasImage = true;
                break;
            }
        }

        if (hasImage) {
            e.preventDefault();
            e.stopPropagation();
            
            for (var i = 0; i < clipboardData.items.length; i++) {
                if (clipboardData.items[i].type.indexOf('image') !== -1) {
                    var file = clipboardData.items[i].getAsFile();
                    var formData = new FormData();
                    formData.append('upload', file);
                    
                    fetch("{{ url_for('incidente.upload_image') }}", {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => response.json())
                    .then(result => {
                        if (result.url) {
                            var range = quill.getSelection();
                            quill.insertEmbed(range.index, 'image', result.url);
                            quill.setSelection(range.index + 1);
                        }
                    })
                    .catch(error => console.error('Error:', error));
                }
            }
        }
    });

    // Bloqueia qualquer tentativa de inserção de imagens base64 via clipboard
    quill.clipboard.addMatcher(Node.ELEMENT_NODE, function(node, delta) {
        if (node.tagName === 'IMG' && node.src && node.src.startsWith('data:image')) {
            var Delta = Quill.import('delta');
            return new Delta(); // Remove o delta da imagem base64
        }
        return delta;
    });

    document.getElementById('incidentForm').onsubmit = function() {
        // Usamos o innerHTML diretamente, mas vamos limpar possíveis restos do quill
        var htmlContent = quill.root.innerHTML;
        
        // Força a remoção de qualquer tag img com src data:image, caso tenha escapado
        var div = document.createElement('div');
        div.innerHTML = htmlContent;
        var imgs = div.querySelectorAll('img');
        imgs.forEach(function(img) {
            if (img.src && img.src.startsWith('data:image')) {
                img.remove(); // Remove imagens base64 restantes
            }
        });
        
        document.getElementById('description_input').value = div.innerHTML;
    };
</script>

{% endblock %}
